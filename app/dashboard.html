<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>严进策略 · 实时做T面板</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--card:#101d2d;--line:#25364b;--text:#edf5ff;--muted:#91a4ba;--green:#24c486;--yellow:#f2b84b;--red:#ff6b71;--blue:#5aa9ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07111f,#0b1727 55%,#07111f);color:var(--text);font:15px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif}main{width:min(980px,100%);margin:auto;padding:20px 14px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}h1{font-size:22px;margin:0}.sub,.muted{color:var(--muted)}button{border:0;border-radius:10px;padding:10px 16px;background:var(--blue);color:white;font-weight:700}button:disabled{opacity:.55}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:rgba(16,29,45,.94);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 12px 30px #0004}.stock-head{display:flex;justify-content:space-between;gap:10px}.stock-head h2{font-size:19px;margin:0}.price{font-size:27px;font-weight:800}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.metric{background:#0a1625;border-radius:10px;padding:9px}.metric b{display:block;font-size:16px}.metric span{font-size:12px;color:var(--muted)}.systems{display:grid;grid-template-columns:1fr 1fr;gap:10px}.system{border:1px solid var(--line);border-radius:12px;padding:11px}.system h3{font-size:14px;margin:0 0 7px}.signal{display:inline-block;padding:3px 8px;border-radius:99px;font-weight:700;font-size:12px}.observe,.trial,.confirm{background:#163e34;color:#61e5b3}.wait{background:#493d20;color:#ffd474}.avoid{background:#48252a;color:#ff9da2}.rows{margin-top:8px;font-size:13px}.rows div{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #ffffff0c;padding:4px 0}.error{color:#ff9da2;padding:14px 0}.foot{text-align:center;margin-top:18px;font-size:12px;color:var(--muted)}@media(max-width:720px){.grid{grid-template-columns:1fr}.systems{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.sub{font-size:12px}}
</style></head><body><main>
<div class="top"><div><h1>严进策略 · 实时做T面板</h1><div id="updated" class="sub">正在读取最新分钟行情…</div></div><button id="refresh">刷新</button></div>
<section id="stocks" class="grid"></section><div class="foot">信号按最新公开分钟数据动态计算，仅供研究，不构成投资建议。</div>
</main><script>
const fmt=(v,d=2)=>v==null?'—':Number(v).toFixed(d),pct=v=>v==null?'—':`${v>0?'+':''}${fmt(v)}%`;
function system(title,s){return `<div class="system"><h3>${title}</h3><span class="signal ${s.status}">${s.label}</span><div class="rows">${title==='做T系统'?`<div><span>低吸观察区</span><b>${fmt(s.buy_zone[0])}–${fmt(s.buy_zone[1])}</b></div><div><span>冲高减T区</span><b>${fmt(s.reduce_zone[0])}–${fmt(s.reduce_zone[1])}</b></div>`:`<div><span>右侧试错参考</span><b>${fmt(s.trial_reference)}</b></div><div><span>突破确认位</span><b>${fmt(s.breakout_confirmation)}</b></div>`}<div><span>失效位</span><b>${fmt(s.invalidation)}</b></div></div></div>`}
function card(s){if(s.error)return `<article class="card"><div class="stock-head"><h2>${s.name} <small>${s.symbol}</small></h2></div><div class="error">行情暂不可用：${s.error}</div></article>`;let m=s.metrics;return `<article class="card"><div class="stock-head"><div><h2>${s.name} <small class="muted">${s.symbol.split('.')[0]}</small></h2><div class="muted">${s.as_of} · ${s.source}</div></div><div class="price">${fmt(m.current)}</div></div><div class="metric-grid"><div class="metric"><b>${fmt(m.vwap)}</b><span>VWAP</span></div><div class="metric"><b>${pct(m.change_15m_pct)}</b><span>15分钟涨跌</span></div><div class="metric"><b>${pct(m.change_30m_pct)}</b><span>30分钟涨跌</span></div><div class="metric"><b>${fmt(m.last_5m_volume_ratio_vs_prev20)}</b><span>近5分/前20分量比</span></div><div class="metric"><b>${m.higher_lows_last_3_bars?'抬高':'未抬高'}</b><span>最近3根低点</span></div><div class="metric"><b>${fmt(m.session_low)} / ${fmt(m.session_high)}</b><span>日内低 / 高</span></div><div class="metric"><b>${pct(m.recovery_from_session_low_pct)}</b><span>低点修复幅度</span></div></div><div class="systems">${system('做T系统',s.signals.t_system)}${system('趋势系统',s.signals.trend_system)}</div></article>`}
async function load(){let b=document.querySelector('#refresh');b.disabled=true;b.textContent='刷新中';try{let r=await fetch('/dashboard/data',{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);let d=await r.json();document.querySelector('#stocks').innerHTML=d.stocks.map(card).join('');document.querySelector('#updated').textContent=`更新于 ${new Date(d.generated_at).toLocaleString('zh-CN')}`;}catch(e){document.querySelector('#stocks').innerHTML=`<article class="card error">面板加载失败：${e.message}</article>`;}finally{b.disabled=false;b.textContent='刷新'}}document.querySelector('#refresh').addEventListener('click',load);load();
</script></body></html>
