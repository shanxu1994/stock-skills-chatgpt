<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>严进策略 · 实时做T面板</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--card:#101d2d;--line:#25364b;--text:#edf5ff;--muted:#91a4ba;--green:#24c486;--yellow:#f2b84b;--red:#ff6b71;--blue:#5aa9ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07111f,#0b1727 55%,#07111f);color:var(--text);font:15px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif}main{width:min(980px,100%);margin:auto;padding:20px 14px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}h1{font-size:22px;margin:0}.sub,.muted{color:var(--muted)}button{border:0;border-radius:10px;padding:10px 16px;background:var(--blue);color:white;font-weight:700}button:disabled{opacity:.55}.controls{display:flex;gap:8px;margin:0 0 16px}.controls input{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;background:#0a1625;color:var(--text);padding:10px 12px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:rgba(16,29,45,.94);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 12px 30px #0004}.stock-head{display:flex;justify-content:space-between;gap:10px}.stock-head h2{font-size:19px;margin:0}.stock-actions{display:flex;align-items:flex-start;gap:6px}.stock-actions button{padding:5px 8px;background:#26384d;font-size:12px}.stock-actions .remove{background:#48252a}.price{font-size:27px;font-weight:800}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.metric{background:#0a1625;border-radius:10px;padding:9px}.metric b{display:block;font-size:16px}.metric span{font-size:12px;color:var(--muted)}.systems{display:grid;grid-template-columns:1fr 1fr;gap:10px}.system{border:1px solid var(--line);border-radius:12px;padding:11px}.system h3{font-size:14px;margin:0 0 7px}.signal{display:inline-block;padding:3px 8px;border-radius:99px;font-weight:700;font-size:12px}.CONFIRMED,.TRIAL,.CONFIRM{background:#163e34;color:#61e5b3}.WAIT,.WATCH{background:#493d20;color:#ffd474}.NO_TRADE{background:#48252a;color:#ff9da2}.rows{margin-top:8px;font-size:13px}.rows div{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #ffffff0c;padding:4px 0}.error{color:#ff9da2;padding:14px 0}.foot{text-align:center;margin-top:18px;font-size:12px;color:var(--muted)}@media(max-width:720px){.grid{grid-template-columns:1fr}.systems{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.sub{font-size:12px}}
</style></head><body><main>
<div class="top"><div><h1>严进策略 · 实时做T面板</h1><div id="updated" class="sub">正在读取最新分钟行情…</div></div><button id="refresh">刷新</button></div>
<form id="add-form" class="controls"><input id="symbol-input" inputmode="numeric" maxlength="6" placeholder="输入6位A股代码，如 600519"><button>添加并分析</button></form>
<section id="stocks" class="grid"></section><div class="foot">信号按最新公开分钟数据动态计算，仅供研究，不构成投资建议。</div>
</main><script>
const fmt=(v,d=2)=>v==null?'—':Number(v).toFixed(d),pct=v=>v==null?'—':`${v>0?'+':''}${fmt(v)}%`;
function system(title,s){return `<div class="system"><h3>${title}</h3><span class="signal ${s.status}">${s.label}</span><div class="rows">${title==='做T系统'?`<div><span>低吸观察区（非买点）</span><b>${fmt(s.buy_zone[0])}–${fmt(s.buy_zone[1])}</b></div><div><span>确认结构</span><b>${s.structure||'等待'}</b></div><div><span>共振评分</span><b>${s.resonance_score??0}/6</b></div><div><span>冲高减T区</span><b>${fmt(s.reduce_zone[0])}–${fmt(s.reduce_zone[1])}</b></div>`:`<div><span>右侧试错参考</span><b>${fmt(s.trial_reference)}</b></div><div><span>突破确认位</span><b>${fmt(s.breakout_confirmation)}</b></div>`}<div><span>失效位</span><b>${fmt(s.invalidation)}</b></div></div></div>`}
const defaults=['001309','600110','300199'],key='strict-dashboard-symbols';let symbols=JSON.parse(localStorage.getItem(key)||'null')||defaults;
const code=s=>s.symbol.split('.')[0],save=()=>localStorage.setItem(key,JSON.stringify(symbols));
function actions(c){return `<div class="stock-actions"><button onclick="refreshOne('${c}')">单独刷新</button><button class="remove" onclick="removeStock('${c}')">删除</button></div>`}
function card(s){let c=code(s);if(s.error)return `<article class="card" data-symbol="${c}"><div class="stock-head"><h2>${s.name} <small>${c}</small></h2>${actions(c)}</div><div class="error">${s.error}</div></article>`;let m=s.metrics;return `<article class="card" data-symbol="${c}"><div class="stock-head"><div><h2>${s.name} <small class="muted">${c}</small></h2><div class="muted">${s.as_of} · ${s.source}</div></div>${actions(c)}</div><div class="price">${fmt(m.current)}</div><div class="metric-grid"><div class="metric"><b>${fmt(m.vwap)}</b><span>VWAP</span></div><div class="metric"><b>${pct(m.change_15m_pct)}</b><span>15分钟涨跌</span></div><div class="metric"><b>${pct(m.change_30m_pct)}</b><span>30分钟涨跌</span></div><div class="metric"><b>${fmt(m.last_5m_volume_ratio_vs_prev20)}</b><span>近5分/前20分量比</span></div><div class="metric"><b>${m.higher_lows_last_3_bars?'抬高':'未抬高'}</b><span>最近3根低点</span></div><div class="metric"><b>${fmt(m.session_low)} / ${fmt(m.session_high)}</b><span>日内低 / 高</span></div><div class="metric"><b>${pct(m.recovery_from_session_low_pct)}</b><span>低点修复幅度</span></div></div><div class="systems">${system('做T系统',s.signals.t_system)}${system('趋势系统',s.signals.trend_system)}</div></article>`}
async function fetchStocks(list){let r=await fetch(`/dashboard/data?symbols=${encodeURIComponent(list.join(','))}`,{cache:'no-store'});if(!r.ok){let e=await r.json();throw Error(e.detail||`HTTP ${r.status}`)}return r.json()}
async function load(){let b=document.querySelector('#refresh');b.disabled=true;b.textContent='刷新中';try{let d=await fetchStocks(symbols);document.querySelector('#stocks').innerHTML=d.stocks.map(card).join('');document.querySelector('#updated').textContent=`更新于 ${new Date(d.generated_at).toLocaleString('zh-CN')} · ${symbols.length}只`;}catch(e){document.querySelector('#stocks').innerHTML=`<article class="card error">面板加载失败：${e.message}</article>`;}finally{b.disabled=false;b.textContent='刷新'}}
async function refreshOne(c){let el=document.querySelector(`[data-symbol="${c}"]`);if(el)el.style.opacity='.55';try{let d=await fetchStocks([c]);if(el)el.outerHTML=card(d.stocks[0]);}catch(e){alert(e.message)}}
function removeStock(c){symbols=symbols.filter(x=>x!==c);if(!symbols.length)symbols=[...defaults];save();load()}
document.querySelector('#add-form').addEventListener('submit',e=>{e.preventDefault();let input=document.querySelector('#symbol-input'),c=input.value.trim();if(!/^\d{6}$/.test(c))return alert('请输入6位A股代码');if(!symbols.includes(c)){if(symbols.length>=10)return alert('最多添加10只股票');symbols.push(c);save()}input.value='';load()});document.querySelector('#refresh').addEventListener('click',load);load();
</script></body></html>
